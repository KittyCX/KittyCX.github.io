<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leo Xu</title>
  <meta name="description" content="Leo Xu — personal profile. Climb the wall: tap the holds in order to explore the site." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <!-- ===================== Menu bar ===================== -->
  <nav class="menu-bar" aria-label="Primary">
    <a class="menu-bar__link" href="index.html" aria-current="page">Home</a>
    <a class="menu-bar__link" href="about.html">About me</a>
    <a class="menu-bar__link" href="help.html">Help</a>
  </nav>

  <!-- ===================== Climbing wall ===================== -->
  <!-- The homepage IS a climbing wall. Four holds form a route from the
       ground to the top; tap them in order (Help is the last, at the top).
       A wrong hold makes you fall and the route resets. -->
  <main class="wall" id="wall">
    <!-- rock face -->
    <svg class="wall__rock" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
      <defs>
        <filter id="rockGrain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.013 0.026" numOctaves="5" seed="17" stitchTiles="stitch" />
          <feColorMatrix type="matrix" values="0 0 0 0 0.44  0 0 0 0 0.47  0 0 0 0 0.54  0 0 0 0.5 0" />
        </filter>
        <linearGradient id="rockShade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1c2a4e" />
          <stop offset="55%" stop-color="#121b36" />
          <stop offset="100%" stop-color="#080e1d" />
        </linearGradient>
        <radialGradient id="wallLight" cx="68%" cy="12%" r="75%">
          <stop offset="0%" stop-color="#31406e" stop-opacity="0.85" />
          <stop offset="100%" stop-color="#31406e" stop-opacity="0" />
        </radialGradient>
      </defs>

      <rect width="1440" height="900" fill="url(#rockShade)" />
      <rect width="1440" height="900" fill="url(#wallLight)" />

      <!-- rock facets -->
      <g opacity="0.5">
        <polygon points="0,0 540,0 330,300 0,470" fill="#0d1626" />
        <polygon points="540,0 1440,0 1440,240 760,300" fill="#101a30" />
        <polygon points="0,470 330,300 700,420 520,900 0,900" fill="#0b1322" />
        <polygon points="760,300 1440,240 1440,640 900,560" fill="#0e1830" />
        <polygon points="700,420 900,560 820,900 520,900" fill="#0a1220" />
        <polygon points="900,560 1440,640 1440,900 820,900" fill="#0c1526" />
      </g>

      <!-- cracks -->
      <g stroke="#04070f" stroke-opacity="0.55" fill="none" stroke-width="2.2" stroke-linecap="round">
        <path d="M150 0 C 190 180, 110 320, 170 480 S 150 740, 200 900" />
        <path d="M640 0 C 600 150, 680 280, 620 420 S 670 660, 610 900" />
        <path d="M1140 0 C 1100 210, 1180 350, 1120 520 S 1160 760, 1110 900" />
        <path d="M0 260 C 260 230, 440 320, 720 270 S 1180 210, 1440 300" />
        <path d="M0 620 C 300 600, 520 680, 860 630 S 1240 580, 1440 660" />
      </g>

      <!-- stone grain -->
      <rect width="1440" height="900" filter="url(#rockGrain)" opacity="0.32" />
    </svg>

    <!-- climbing route — one segment per gap, revealed as holds light up -->
    <svg class="wall__route" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <line class="route-seg" x1="18" y1="82" x2="58" y2="63" />
      <line class="route-seg" x1="58" y1="63" x2="30" y2="42" />
      <line class="route-seg" x1="30" y1="42" x2="74" y2="20" />
    </svg>

    <!-- chalk title + how-to hint -->
    <div class="wall__head">
      <p class="wall__eyebrow">Grade 9 &middot; 2026</p>
      <h1 class="wall__name">Leo Xu</h1>
      <p class="wall__hint">
        <b>Climb the wall:</b> tap the holds <b>in order</b> to reach the top
        &mdash; each hold opens a page. A wrong hold and you fall!
      </p>
    </div>

    <!-- the climber -->
    <div class="climber" id="climber" aria-hidden="true">
      <svg viewBox="0 0 24 34" width="26" height="37">
        <circle cx="12" cy="6" r="4" fill="none" stroke="#efe7d8" stroke-width="2.2" />
        <path
          d="M12 10.5 V21 M12 13 L5.5 16.5 M12 13 L18.5 16.5 M12 21 L7 30.5 M12 21 L17 30.5"
          fill="none"
          stroke="#efe7d8"
          stroke-width="2.2"
          stroke-linecap="round"
        />
      </svg>
    </div>

    <!-- ===================== Holds (climb order) ====================
         1. About me (ground, left)      2. Rock Climbing (right)
         3. Projects (left)              4. Help (the top, last)       -->
    <button
      class="hold"
      type="button"
      data-step="0"
      data-href="about.html"
      data-name="About me"
      style="--x: 18%; --y: 82%; --hold-hi: #ffa48f; --hold-lo: #c0392b"
      aria-label="Climbing hold 1 of 4 — About me"
    >
      <span class="hold__rock" aria-hidden="true"></span>
      <span class="hold__tag" aria-hidden="true">About me</span>
    </button>

    <button
      class="hold"
      type="button"
      data-step="1"
      data-href="climbing.html"
      data-name="Rock Climbing"
      style="--x: 58%; --y: 63%; --hold-hi: #93d9d2; --hold-lo: #147d8a"
      aria-label="Climbing hold 2 of 4 — Rock Climbing"
    >
      <span class="hold__rock" aria-hidden="true"></span>
      <span class="hold__tag" aria-hidden="true">Rock Climbing</span>
    </button>

    <button
      class="hold"
      type="button"
      data-step="2"
      data-href="projects.html"
      data-name="Projects"
      style="--x: 30%; --y: 42%; --hold-hi: #c9adf2; --hold-lo: #6c4fc4"
      aria-label="Climbing hold 3 of 4 — Projects"
    >
      <span class="hold__rock" aria-hidden="true"></span>
      <span class="hold__tag" aria-hidden="true">Projects</span>
    </button>

    <button
      class="hold"
      type="button"
      data-step="3"
      data-href="help.html"
      data-name="Help"
      style="--x: 74%; --y: 20%; --hold-hi: #ffd98a; --hold-lo: #d99a2b"
      aria-label="Climbing hold 4 of 4 — Help, the last hold"
    >
      <span class="hold__rock" aria-hidden="true"></span>
      <span class="hold__tag" aria-hidden="true">Help</span>
    </button>

    <!-- feedback line -->
    <p class="wall__status" id="climbStatus" role="status" aria-live="polite"></p>
  </main>

  <!-- ===================== Footer ===================== -->
  <footer class="site-footer">
    <p class="site-footer__mark">Leo Xu</p>
    <p class="site-footer__meta">Personal profile &middot; 2026</p>
  </footer>

  <script src="js/climb.js"></script>
</body>
</html>
