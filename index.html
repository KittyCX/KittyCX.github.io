<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

          <stop offset="100%" stop-color="#f0c463" stop-opacity="0" />

        <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#2b3a63" stop-opacity="0.55" />
          <stop offset="100%" stop-color="#2b3a63" stop-opacity="0" />
        </radialGradient>

      <ellipse cx="1020" cy="250" rx="420" ry="240" fill="url(#nebula)" />
      <ellipse cx="720" cy="470" rx="640" ry="150" fill="url(#nebula)" opacity="0.42" transform="rotate(-11 720 470)" />
      <ellipse cx="420" cy="700" rx="380" ry="220" fill="url(#nebula)" opacity="0.6" />

        <path d="M482 300 l3.4 12.6 12.6 3.4 -12.6 3.4 -3.4 12.6 -3.4 -12.6 -12.6 -3.4 12.6 -3.4 z" opacity="0.9" />

        <path d="M712 640 l3 11 11 3 -11 3 -3 11 -3 -11 -11 -3 11 -3 z" opacity="0.7" />
        <path d="M142 246 l2.2 8 8 2.2 -8 2.2 -2.2 8 -2.2 -8 -8 -2.2 8 -2.2 z" opacity="0.6" />
        <path d="M1346 690 l2.4 8.6 8.6 2.4 -8.6 2.4 -2.4 8.6 -2.4 -8.6 -8.6 -2.4 8.6 -2.4 z" opacity="0.55" />
      </g>

      <!-- star glows -->
      <g fill="url(#starGlow)">
        <circle cx="906" cy="196" r="26" />
        <circle cx="296" cy="470" r="22" />
        <circle cx="1246" cy="506" r="20" />
        <circle cx="482" cy="300" r="18" />
      </g>
    </svg>

    <div class="hero__content">
      <h1 class="hero__name">Leo Xu</h1>
      <p class="hero__eyebrow">Grade 9 &middot; 2026</p>
    </div>

    <div class="hero__scroll" aria-hidden="true">
      <span class="hero__scroll-label">Scroll</span>
      <i class="hero__scroll-line"></i>
    </div>
  </header>

  <!-- ===================== Rock climbing ===================== -->
  <main>
    <section class="climb" aria-labelledby="climb-title">
      <h2 class="climb__title" id="climb-title">Rock Climbing</h2>
      <img
        class="climb__art"
        src="assets/climb_art.jpg"
        width="1857"
        height="1182"
        alt="Illustration of a young climber in an orange harness, holding a rope in front of a bouldering wall covered in colourful holds"
      />
      <p class="climb__note">Indoor walls, chalked hands, and the quiet before the first move.</p>
    </section>
  </main>

  <!-- ===================== Footer ===================== -->
  <footer class="site-footer">
    <p class="site-footer__mark">Leo Xu</p>
    <p class="site-footer__meta">Personal profile &middot; 2026</p>
  </footer>
